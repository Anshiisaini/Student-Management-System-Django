{% extends 'students/base.html' %}{% block content %}<div class="toolbar"><h2>Students</h2><a class="button" href="{% url 'add_student' %}">+ Add Student</a></div><form method="get" action="{% url 'student_list' %}" class="search"><input name="search" value="{{ query }}" placeholder="Search by name or course"><button type="submit">Search</button><a href="{% url 'student_list' %}">Clear</a></form><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Age</th><th>Course</th><th>Actions</th></tr></thead><tbody>{% for student in students %}<tr><td>{{ student.name }}</td><td>{{ student.email }}</td><td>{{ student.age }}</td><td>{{ student.course }}</td><td><a href="{% url 'update_student' student.id %}">Edit</a> · <a href="{% url 'delete_student' student.id %}">Delete</a></td></tr>{% empty %}<tr><td colspan="5">No students found.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
